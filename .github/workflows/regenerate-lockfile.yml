name: Refresh dependency lockfile (audit branch only)

on:
  push:
    branches:
      - audit/production-readiness-fixes
    paths:
      - package.json
      - .github/workflows/regenerate-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-readiness-fixes
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Regenerate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exactly the regenerated lockfile
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Report dependency audit
        run: npm audit || true
      - name: Commit lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "Update dependency lockfile to patched releases"
            git push origin HEAD:audit/production-readiness-fixes
          fi
