name: Shopora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Run tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: shopora-dist
          path: dist/
          if-no-files-found: error

      - name: Create source archive
        run: zip -r shopora-source.zip . -x ".git/*" "node_modules/*" "dist/*" "shopora-source.zip"
      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: shopora-source
          path: shopora-source.zip
          if-no-files-found: error
